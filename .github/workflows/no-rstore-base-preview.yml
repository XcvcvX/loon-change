name: Build no-R-Store-base Loon preview

on:
  push:
    branches:
      - preview/no-rstore-base
    paths:
      - '.github/workflows/no-rstore-base-preview.yml'
      - 'apply_local_overrides.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/no-rstore-base-preview.yml'
      - 'apply_local_overrides.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin and stage independent Romeo sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/amap /tmp/spotify-scripts sources/alipayAdBlock sources/spotify scripts/spotify
          git clone --depth 1 https://github.com/ifflagged/Romeo.git /tmp/romeo
          ROMEO_SHA="$(git -C /tmp/romeo rev-parse HEAD)"
          echo "ROMEO_SHA=$ROMEO_SHA" >> "$GITHUB_ENV"
          python3 stage_romeo_plugins.py --romeo-repo /tmp/romeo --commit "$ROMEO_SHA" --output /tmp/romeo/plugins --zmjde-output /tmp/romeo-zmjde/Plugin
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf" > /tmp/GuaZiVideoAds.conf
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/zirawell/Beta/alipayAdBlock.lpx" > sources/alipayAdBlock/alipayAdBlock.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/sooyaaabo/Amap.lpx" > /tmp/amap/Amap.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/rucu6_amap.js" > /tmp/amap/rucu6_amap.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/loon_Amap.recommend.jq" > /tmp/amap/loon_Amap.recommend.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_updatable.jq" > /tmp/amap/updatable.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_search_poi_detail.jq" > /tmp/amap/search_poi_detail.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/devchristian1337/Official/Spotify.lpx" > sources/spotify/Spotify.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-gabo.js" > /tmp/spotify-scripts/spot-gabo.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoSearchAd.js" > /tmp/spotify-scripts/spot-NoSearchAd.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoHomeAd.js" > /tmp/spotify-scripts/spot-NoHomeAd.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoScrollAd.js" > /tmp/spotify-scripts/spot-NoScrollAd.js
          python3 apply_amap_local_overrides.py --plugin /tmp/amap/Amap.lpx
          cp /tmp/amap/* sources/amap/
          git apply --check patches/amap-rucu6-performance.patch
          git apply patches/amap-rucu6-performance.patch
          node --check sources/amap/rucu6_amap.js

      - name: Validate independent upstream sources
        run: |
          python3 source_guard.py --romeo /tmp/romeo --zmjde /tmp/romeo-zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --previous-report source-report.json --report /tmp/no-rstore-source-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('/tmp/no-rstore-source-report.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          data['build_mode'] = 'no-rstore-base-preview'
          data['R-Store-base'] = {'status': 'excluded_intentionally'}
          data['Romeo'] = {'commit': os.environ['ROMEO_SHA'], 'status': 'pinned_independent_sources'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Create empty base scaffold (no R-Store content)
        run: |
          cat > /tmp/no-rstore-empty-base.plugin <<'EOF'
          #!name=No R-Store Base Scaffold
          #!desc=Empty structural input used only by the independent-source preview builder.
          [Argument]
          [Rule]
          [Rewrite]
          [Script]
          [MITM]
          EOF

      - name: Merge independent sources only
        run: |
          python3 merge_plugins.py --base /tmp/no-rstore-empty-base.plugin --extra none --filter none --romeo-plugins /tmp/romeo --zmjde /tmp/romeo-zmjde/Plugin --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --myblockads none --alipayadblock sources/alipayAdBlock/alipayAdBlock.lpx --out /tmp/no-rstore-base.plugin --provenance-out /tmp/no-rstore-rule-provenance.json --source-report /tmp/no-rstore-source-report.json

      - name: Integrate Spotify and apply local compatibility fixes
        run: |
          python3 integrate_spotify.py --plugin /tmp/no-rstore-base.plugin --source-plugin sources/spotify/Spotify.lpx --scripts-source /tmp/spotify-scripts --scripts-dest scripts/spotify --upstream-commit "$ROMEO_SHA" --metadata /tmp/no-rstore-spotify-upstream.json
          python3 apply_local_overrides.py --plugin /tmp/no-rstore-base.plugin
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/no-rstore-base.plugin')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacements = {
              '#!name=': '#!name=独立来源去广告净化合集（无 R-Store base）',
              '#!desc=': '#!desc=仅合并 Romeo/Kelee/AOOMEE 快照、高德、Spotify、支付宝与瓜子影视等独立来源；不含 R-Store base。',
              '#!author=': '#!author=Romeo / RuCu6（Amap）/ zirawell / ddgksf2013（本仓库自动构建）',
              '#!note=': '#!note=本预览不含 R-Store base；独立 App 插件与专项规则按来源合并，覆盖范围低于原综合版。',
              '#!sources=': '#!sources=Romeo-independent-App+Romeo-Spotify+RuCu6-Amap+zirawell-AlipayAdBlock+ddgksf2013/GuaZiVideoAds',
          }
          output = []
          for line in lines:
              matched = next((prefix for prefix in replacements if line.startswith(prefix)), None)
              output.append(replacements[matched] if matched else line)
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          # Some independent Romeo rules refer to exact response hosts without
          # carrying their own MITM declarations. Add only the six exact hosts
          # reported by the validator, and only when a rule actually references them.
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('/tmp/no-rstore-base.plugin')
          text = path.read_text(encoding='utf-8')
          required = {
              'api.k.sohu.com',
              'image.suning.cn',
              'mcs-mimp-web.sf-express.com',
              'outfliggys.m.taobao.com',
              's1.api.tv.itc.cn',
              'ucmp-static.sf-express.com',
          }
          referenced = required
          lines = text.splitlines()
          mitm_start = next((i for i, line in enumerate(lines) if line.strip().lower() == '[mitm]'), None)
          if mitm_start is None:
              raise SystemExit('MITM section missing in no-base preview')
          mitm_end = next((i for i in range(mitm_start + 1, len(lines)) if lines[i].startswith('[') and lines[i].endswith(']')), len(lines))
          host_line = next((i for i in range(mitm_start + 1, mitm_end) if lines[i].strip().lower().startswith('hostname') and '=' in lines[i]), None)
          if host_line is None:
              lines.insert(mitm_start + 1, 'hostname = ' + ', '.join(sorted(referenced)))
          else:
              key, value = lines[host_line].split('=', 1)
              hosts = [host.strip() for host in value.split(',') if host.strip()]
              lines[host_line] = key + '= ' + ', '.join(sorted(set(hosts) | referenced))
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 fix_script_configs.py --plugin /tmp/no-rstore-base.plugin
          python3 check_script_v2.py /tmp/no-rstore-base.plugin
          python3 validate_plugin.py /tmp/no-rstore-base.plugin
          node --check sources/amap/rucu6_amap.js

      - name: Generate audit and coverage reports
        run: |
          python3 audit_plugin.py /tmp/no-rstore-base.plugin --output /tmp/no-rstore-audit.json
          python3 deep_audit.py /tmp/no-rstore-base.plugin --json /tmp/no-rstore-deep-audit.json --markdown /tmp/no-rstore-deep-audit.md
          python3 runtime_performance_audit.py /tmp/no-rstore-base.plugin --repo-root . --json /tmp/no-rstore-runtime-audit.json --markdown /tmp/no-rstore-runtime-audit.md
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('/tmp/no-rstore-base.plugin')
          s=p.read_text(encoding='utf-8')
          sections={}
          current=''
          for line in s.splitlines():
              stripped=line.strip()
              if stripped.startswith('[') and stripped.endswith(']'):
                  current=stripped[1:-1]; sections.setdefault(current,0)
              elif current and line.strip() and not line.lstrip().startswith('#'):
                  sections[current]=sections.get(current,0)+1
          report={
            'build_mode':'no-rstore-base-preview',
            'upstream_romeo_commit':__import__('os').environ.get('ROMEO_SHA'),
            'section_counts':sections,
            'plugin_bytes':p.stat().st_size,
            'rstore_base_included':False,
            'known_scope_note':'R-Store-only base coverage and base-conditioned supplements are intentionally absent; validate app-by-app before replacing production.'
          }
          Path('/tmp/no-rstore-preview-summary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload installable Loon plugin and reports
        uses: actions/upload-artifact@v4
        with:
          name: no-rstore-base-preview
          path: |
            /tmp/no-rstore-base.plugin
            /tmp/no-rstore-preview-summary.json
            /tmp/no-rstore-source-report.json
            /tmp/no-rstore-rule-provenance.json
            /tmp/no-rstore-audit.json
            /tmp/no-rstore-deep-audit.json
            /tmp/no-rstore-deep-audit.md
            /tmp/no-rstore-runtime-audit.json
            /tmp/no-rstore-runtime-audit.md
          retention-days: 30
