name: Python tests

on:
  pull_request:
    paths:
      - 'tests/**'
      - '*.py'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '*.py'
      - '.github/workflows/python-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile root-level Python tools
        run: python -m py_compile *.py
      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
