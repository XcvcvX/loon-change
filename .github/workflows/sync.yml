name: Sync multi-source ad-block plugins (QuanX -> Loon)

on:
  push:
    branches: [main]
    paths:
      - 'merge_plugins.py'
      - 'source_guard.py'
      - 'convert_qx2loon.py'
      - 'convert_filter_qx2loon.py'
      - '.github/workflows/sync.yml'
  pull_request:
    paths:
      - 'validate_plugin.py'
      - 'source_guard.py'
      - 'merge_plugins.py'
      - 'test_merge_plugins.py'
      - 'test_validate_plugin.py'
      - 'test_source_guard.py'
      - 'audit_plugin.py'
      - 'test_audit_plugin.py'
      - '.github/workflows/sync.yml'
      - 'README.md'
      - 'sources/amap/**'
  schedule:
    - cron: '7 1 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py validate_plugin.py source_guard.py audit_plugin.py convert_qx2loon.py convert_filter_qx2loon.py
      - name: 运行单元与合并集成测试
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py
      - name: 审计当前插件风险摘要
        run: python3 audit_plugin.py allAdRewrite.plugin --summary-only

  sync:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 测试校验器
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py

      - name: 创建隔离构建目录
        run: mkdir -p /tmp/loon-build

      - name: 转换重写规则（先写入临时产物）
        run: python3 convert_qx2loon.py -o /tmp/loon-build/allAdRewrite.plugin

      - name: 拉取 Thelongdarkorg 去广告插件
        run: |
          git clone --depth 1 https://github.com/Thelongdarkorg/loon-plugins.git /tmp/loon-plugins
          ls /tmp/loon-plugins/*_ad_block.plugin /tmp/loon-plugins/*_splash_ad_block.plugin | wc -l

      - name: 拉取 aoomee 去广告插件
        run: |
          git clone --depth 1 https://github.com/aoomee/Loon-Adblock-Plugins.git /tmp/aoomee
          ls /tmp/aoomee/plugins | wc -l

      - name: 拉取 zmjde 去广告插件
        run: |
          git clone --depth 1 https://github.com/zmjde/loon-plugins.git /tmp/zmjde
          ls /tmp/zmjde/Plugin | wc -l

      - name: 下载瓜子影视去广告
        run: |
          curl -fsSL --retry 5 --retry-all-errors -A "surge" \
            https://ddgksf2013.top/rewrite/GuaZiVideoAds.conf -o /tmp/GuaZiVideoAds.conf
          wc -c /tmp/GuaZiVideoAds.conf

      - name: 下载高德插件及全部远程依赖
        run: |
          mkdir -p /tmp/amap sources/amap
          base=https://raw.githubusercontent.com/ifflagged/Romeo/main/Modules
          curl -fsSL --retry 5 --retry-all-errors "$base/Loon/sooyaaabo/Amap.lpx" -o /tmp/amap/Amap.lpx
          curl -fsSL --retry 5 --retry-all-errors "$base/JavaScript/sooyaaabo/Amap/rucu6_amap.js" -o /tmp/amap/rucu6_amap.js
          curl -fsSL --retry 5 --retry-all-errors "$base/JavaScript/sooyaaabo/Amap/loon_Amap.recommend.jq" -o /tmp/amap/loon_Amap.recommend.jq
          curl -fsSL --retry 5 --retry-all-errors "$base/JavaScript/Kelee/Amap_remove_ads/kelee_updatable.jq" -o /tmp/amap/updatable.jq
          curl -fsSL --retry 5 --retry-all-errors "$base/JavaScript/Kelee/Amap_remove_ads/kelee_search_poi_detail.jq" -o /tmp/amap/search_poi_detail.jq
          for f in /tmp/amap/*; do test -s "$f"; done
          wc -c /tmp/amap/*

      - name: 校验克隆来源并生成来源报告
        run: |
          python3 source_guard.py --thelong /tmp/loon-plugins --aoomee /tmp/aoomee --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --previous-report source-report.json --report source-report.json
          cp /tmp/amap/* sources/amap/

      - name: 合并各来源去广告规则（临时目录）
        run: python3 merge_plugins.py --base /tmp/loon-build/allAdRewrite.plugin --extra fetch --filter fetch --apps /tmp/loon-plugins --aoomee /tmp/aoomee --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --myblockads fetch --out /tmp/loon-build/allAdRewrite.plugin

      - name: 校验临时产物并同步 README 统计
        run: python3 validate_plugin.py /tmp/loon-build/allAdRewrite.plugin --update-readme README.md

      - name: 只读审计 UDP、MITM 与 Script 风险
        run: python3 audit_plugin.py /tmp/loon-build/allAdRewrite.plugin --summary-only

      - name: 校验通过后替换正式产物
        run: cp /tmp/loon-build/allAdRewrite.plugin allAdRewrite.plugin.tmp && mv allAdRewrite.plugin.tmp allAdRewrite.plugin

      # 可选网络检查：仅输出警告，不因上游短暂限流阻断规则同步。
      # 本地排查远程脚本：python3 validate_plugin.py allAdRewrite.plugin --check-remote
      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- allAdRewrite.plugin README.md source-report.json sources/amap/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并产物与统计均无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allAdRewrite.plugin README.md source-report.json sources/amap/
          git commit -m "chore: sync upstream rules and plugin stats $(date -u +%Y-%m-%d)"
          git push
