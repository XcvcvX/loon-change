name: Sync multi-source ad-block plugins (QuanX -> Loon)

on:
  push:
    branches: [main]
    paths:
      - 'merge_plugins.py'
      - 'mitm_policy.py'
      - 'validate_plugin.py'
      - 'audit_plugin.py'
      - 'deep_audit.py'
      - 'source_guard.py'
      - 'amap_dependency_guard.py'
      - 'apply_amap_local_overrides.py'
      - 'test_apply_amap_local_overrides.py'
      - 'compare_rule_provenance.py'
      - 'source_health_guard.py'
      - 'finalize_provenance.py'
      - 'test_finalize_provenance.py'
      - 'rule_risk_history.py'
      - 'convert_qx2loon.py'
      - 'test_convert_qx2loon.py'
      - 'convert_filter_qx2loon.py'
      - 'test_convert_filter_qx2loon.py'
      - 'apply_local_overrides.py'
      - 'integrate_spotify.py'
      - 'test_integrate_spotify.py'
      - 'sources/spotify/**'
      - 'sources/alipayAdBlock/**'
      - 'sources/romeo_legacy/**'
      - 'scripts/**'
      - '.github/workflows/sync.yml'
  pull_request:
    paths:
      - 'validate_plugin.py'
      - 'source_guard.py'
      - 'merge_plugins.py'
      - 'mitm_policy.py'
      - 'test_mitm_policy.py'
      - 'test_merge_plugins.py'
      - 'test_validate_plugin.py'
      - 'test_source_guard.py'
      - 'audit_plugin.py'
      - 'test_audit_plugin.py'
      - 'deep_audit.py'
      - 'test_deep_audit.py'
      - 'amap_dependency_guard.py'
      - 'test_amap_dependency_guard.py'
      - 'apply_amap_local_overrides.py'
      - 'test_apply_amap_local_overrides.py'
      - 'compare_rule_provenance.py'
      - 'test_compare_rule_provenance.py'
      - 'source_health_guard.py'
      - 'test_source_health_guard.py'
      - 'finalize_provenance.py'
      - 'test_finalize_provenance.py'
      - 'rule_risk_history.py'
      - 'test_rule_risk_history.py'
      - 'convert_qx2loon.py'
      - 'test_convert_qx2loon.py'
      - 'convert_filter_qx2loon.py'
      - 'test_convert_filter_qx2loon.py'
      - '.github/workflows/sync.yml'
      - 'README.md'
      - 'sources/amap/**'
      - 'sources/alipayAdBlock/**'
      - 'sources/romeo_legacy/**'
      - 'scripts/**'
      - 'apply_local_overrides.py'
      - 'test_apply_local_overrides.py'
      - 'integrate_spotify.py'
      - 'test_integrate_spotify.py'
      - 'sources/spotify/**'
  schedule:
    - cron: '7 1 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py mitm_policy.py validate_plugin.py source_guard.py audit_plugin.py deep_audit.py amap_dependency_guard.py apply_amap_local_overrides.py compare_rule_provenance.py source_health_guard.py finalize_provenance.py rule_risk_history.py convert_qx2loon.py convert_filter_qx2loon.py integrate_spotify.py apply_local_overrides.py
      - name: 运行单元与合并集成测试
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py test_deep_audit.py test_mitm_policy.py test_amap_dependency_guard.py test_apply_amap_local_overrides.py test_compare_rule_provenance.py test_source_health_guard.py test_finalize_provenance.py test_rule_risk_history.py test_integrate_spotify.py test_convert_qx2loon.py test_convert_filter_qx2loon.py
      - name: 应用并测试本地插件覆盖
        run: |
          python3 -m unittest -v test_apply_local_overrides.py test_integrate_spotify.py
          python3 apply_local_overrides.py --plugin allAdRewrite.plugin
      - name: 审计当前插件风险摘要
        run: |
          python3 audit_plugin.py allAdRewrite.plugin --summary-only
          python3 deep_audit.py allAdRewrite.plugin --summary-only
          python3 deep_audit.py allAdRewrite.plugin --json /tmp/deep-audit.json --markdown /tmp/deep-audit.md
      - name: 上传深度审计报告
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-report
          path: |
            /tmp/deep-audit.json
            /tmp/deep-audit.md
          if-no-files-found: error

  sync:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: loon-change-main-sync
      queue: max
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py mitm_policy.py validate_plugin.py source_guard.py audit_plugin.py deep_audit.py amap_dependency_guard.py apply_amap_local_overrides.py compare_rule_provenance.py source_health_guard.py finalize_provenance.py rule_risk_history.py convert_qx2loon.py convert_filter_qx2loon.py integrate_spotify.py

      - name: 测试校验器与来源依赖门禁
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py test_deep_audit.py test_mitm_policy.py test_amap_dependency_guard.py test_apply_amap_local_overrides.py test_compare_rule_provenance.py test_source_health_guard.py test_finalize_provenance.py test_rule_risk_history.py test_integrate_spotify.py test_convert_qx2loon.py test_convert_filter_qx2loon.py

      - name: 创建隔离构建目录
        run: |
          mkdir -p /tmp/loon-build
          if [ -s source-report.json ]; then
            cp source-report.json /tmp/loon-build/source-report.previous.json
          else
            printf '{}' > /tmp/loon-build/source-report.previous.json
          fi
          if [ -s rule-history.json ]; then
            cp rule-history.json /tmp/loon-build/rule-history.previous.json
          else
            printf '{\"schema_version\":1,\"snapshots\":[]}' > /tmp/loon-build/rule-history.previous.json
          fi
          if [ -s rule-provenance.json ]; then
            cp rule-provenance.json /tmp/loon-build/rule-provenance.previous.json
          else
            printf '{"schema_version":1,"upstream_revisions":{},"rewrite":[],"script":[],"rule_events":[]}' > /tmp/loon-build/rule-provenance.previous.json
          fi

      - name: 转换重写规则（先写入临时产物）
        run: python3 convert_qx2loon.py -o /tmp/loon-build/allAdRewrite.plugin

      - name: 转换独立分流规则（含 Frontier / HTTPDNS 安全排除）
        run: |
          curl -fsSL --retry 5 --retry-all-errors -A "Mozilla/5.0" \
            https://raw.githubusercontent.com/zirawell/R-Store/main/Rule/QuanX/Adblock/All/filter/allAdBlock.list \
            -o /tmp/loon-build/allAdBlock-source.list
          python3 convert_filter_qx2loon.py -i /tmp/loon-build/allAdBlock-source.list \
            --list /tmp/loon-build/allAdBlock-Loon.list \
            --plugin /tmp/loon-build/allAdBlock-Loon.plugin

      - name: 拉取 Thelongdarkorg 去广告插件
        run: |
          git clone --depth 1 https://github.com/Thelongdarkorg/loon-plugins.git /tmp/loon-plugins
          ls /tmp/loon-plugins/*_ad_block.plugin /tmp/loon-plugins/*_splash_ad_block.plugin | wc -l

      - name: 拉取 zmjde 去广告插件
        run: |
          git clone --depth 1 https://github.com/zmjde/loon-plugins.git /tmp/zmjde
          ls /tmp/zmjde/Plugin | wc -l

      - name: 固定 Romeo 上游版本并下载瓜子影视、高德与 MyBlockAds 插件及依赖
        run: |
          mkdir -p /tmp/amap sources/amap sources/alipayAdBlock
          git clone --depth 1 https://github.com/ifflagged/Romeo.git /tmp/romeo
          ROMEO_SHA="$(git -C /tmp/romeo rev-parse HEAD)"
          echo "ROMEO_SHA=$ROMEO_SHA" >> "$GITHUB_ENV"
          # 用固定 Romeo commit 替换原 AOOMEE 上游；文件名保留兼容，便于来源追溯。
          # 20 个原 AOOMEE 插件槽由 Romeo 对应作者/应用模块更新，PDD 拆为 filter + rewrite。
          mkdir -p /tmp/romeo/plugins
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/fmz200/12306.lpx" > /tmp/romeo/plugins/12306.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/amap.lpx" > /tmp/romeo/plugins/amap.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/zirawell/boc.lpx" > /tmp/romeo/plugins/boc.plugin
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/sooyaaabo/CheLaiLe.lpx" > /tmp/romeo/plugins/chelaile.plugin
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/cmbchina.lpx" > /tmp/romeo/plugins/cmbchina.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/didi.lpx" > /tmp/romeo/plugins/didi.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/github.lpx" > /tmp/romeo/plugins/github.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/goofish.lpx" > /tmp/romeo/plugins/goofish.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/hupu.lpx" > /tmp/romeo/plugins/hupu.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/jd.lpx" > /tmp/romeo/plugins/jd.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/keep.lpx" > /tmp/romeo/plugins/keep.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/leisu.lpx" > /tmp/romeo/plugins/leisu.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ZenmoFeiShi/MT.lpx" > /tmp/romeo/plugins/meituan.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/pdd-filter.lpx" > /tmp/romeo/plugins/pdd-filter.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/pdd-rewrite.lpx" > /tmp/romeo/plugins/pdd-rewrite.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/pupu.lpx" > /tmp/romeo/plugins/pupu.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ccyykk666/qunar_ad.lpx" > /tmp/romeo/plugins/qunar.plugin
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/soul.lpx" > /tmp/romeo/plugins/soul-new.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ishowshu/taobao.lpx" > /tmp/romeo/plugins/taobao.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/ddgksf2013/UmetripAds.lpx" > /tmp/romeo/plugins/umetrip.plugin
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/Maasea/YouTube.Enhance.lpx" > /tmp/romeo/plugins/youtube.lpx
          # Romeo 没有完整等价版本的 AOOMEE 独有/定制插件：保留已审计快照，不丢失现有功能。
          cp sources/romeo_legacy/51cg.plugin /tmp/romeo/plugins/51cg.plugin
          cp sources/romeo_legacy/91porn.plugin /tmp/romeo/plugins/91porn.plugin
          cp sources/romeo_legacy/cmcc.plugin /tmp/romeo/plugins/cmcc.plugin
          cp sources/romeo_legacy/huazhu.plugin /tmp/romeo/plugins/huazhu.plugin
          cp sources/romeo_legacy/chelaile2.plugin /tmp/romeo/plugins/chelaile2.plugin
          cp sources/romeo_legacy/qunar-legacy.plugin /tmp/romeo/plugins/qunar-legacy.plugin
          cp sources/romeo_legacy/youtube-zh.lpx /tmp/romeo/plugins/youtube-zh.lpx
          test "$(find /tmp/romeo/plugins -maxdepth 1 -type f | wc -l)" -eq 28
          echo "Romeo-backed plugin feed: $(find /tmp/romeo/plugins -maxdepth 1 -type f | wc -l) files"
          # 瓜子影视使用 Romeo 收录的 ddgksf2013 官方 QuanX 源文件，继续走原有 QuanX -> Loon 转换链路。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf" > /tmp/GuaZiVideoAds.conf
          wc -c /tmp/GuaZiVideoAds.conf
          echo "GuaZiVideoAds upstream: ifflagged/Romeo@$ROMEO_SHA:Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf"
          # MyBlockAds 与高德共用同一固定 commit，避免 Pages 源失败后长期使用陈旧缓存。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/rucu6/myblockads.lpx" > myblockads.lpx
          python3 -c 'from pathlib import Path; from source_guard import validate_myblockads; p=Path("myblockads.lpx"); s=validate_myblockads(p.read_text(encoding="utf-8-sig")); print("MyBlockAds Romeo cache validated:", s)'
          echo "MyBlockAds upstream: ifflagged/Romeo@$ROMEO_SHA:Modules/Loon/rucu6/myblockads.lpx"
          # zirawell AlipayAdBlock：只缓存插件源；重复脚本由 base 已有 Eleme handler 覆盖，不另载入第二份脚本。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/zirawell/Beta/alipayAdBlock.lpx" > sources/alipayAdBlock/alipayAdBlock.lpx
          python3 -c 'from pathlib import Path; from source_guard import validate_alipayadblock; p=Path("sources/alipayAdBlock/alipayAdBlock.lpx"); print("AlipayAdBlock Romeo cache validated:", validate_alipayadblock(p.read_text(encoding="utf-8-sig")))'
          echo "AlipayAdBlock upstream: ifflagged/Romeo@$ROMEO_SHA:Modules/Loon/zirawell/Beta/alipayAdBlock.lpx"
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/sooyaaabo/Amap.lpx" > /tmp/amap/Amap.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/rucu6_amap.js" > /tmp/amap/rucu6_amap.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/loon_Amap.recommend.jq" > /tmp/amap/loon_Amap.recommend.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_updatable.jq" > /tmp/amap/updatable.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_search_poi_detail.jq" > /tmp/amap/search_poi_detail.jq
          echo "Romeo pinned commit: $ROMEO_SHA"
          wc -c /tmp/amap/*

      - name: 从固定 Romeo commit 获取 Spotify 官方插件及四个脚本
        run: |
          mkdir -p sources/spotify scripts/spotify /tmp/spotify-scripts
          # 与瓜子影视、高德、MyBlockAds 共用同一 ROMEO_SHA，确保一次同步内来源版本一致。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/devchristian1337/Official/Spotify.lpx" > sources/spotify/Spotify.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-gabo.js" > /tmp/spotify-scripts/spot-gabo.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoSearchAd.js" > /tmp/spotify-scripts/spot-NoSearchAd.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoHomeAd.js" > /tmp/spotify-scripts/spot-NoHomeAd.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoScrollAd.js" > /tmp/spotify-scripts/spot-NoScrollAd.js
          echo "Spotify upstream: ifflagged/Romeo@$ROMEO_SHA"
          wc -c sources/spotify/Spotify.lpx /tmp/spotify-scripts/*.js

      - name: 校验克隆来源并生成来源报告
        run: |
          python3 source_guard.py --thelong /tmp/loon-plugins --romeo /tmp/romeo --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --previous-report source-report.json --report source-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path("source-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          from source_guard import validate_alipayadblock
          alipay_path = Path("sources/alipayAdBlock/alipayAdBlock.lpx")
          alipay_source = validate_alipayadblock(alipay_path.read_text(encoding="utf-8-sig"))
          alipay_source.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "upstream_path": "Modules/Loon/zirawell/Beta/alipayAdBlock.lpx",
          })
          report["AlipayAdBlock"] = alipay_source
          romeo_slot = report.get("aoomee")
          if not isinstance(romeo_slot, dict):
              raise SystemExit("source-report.json 缺少 Romeo 替代来源统计")
          romeo_slot.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "source_mode": "Romeo Modules/Loon + pinned AOOMEE-only local snapshots",
              "legacy_snapshot_files": [
                  "51cg.plugin", "91porn.plugin", "cmcc.plugin", "huazhu.plugin",
                  "chelaile2.plugin", "qunar-legacy.plugin", "youtube-zh.lpx"
              ],
              "romeo_module_paths": [
                  "Modules/Loon/fmz200/12306.lpx", "Modules/Loon/ishowshu/amap.lpx",
                  "Modules/Loon/zirawell/boc.lpx", "Modules/Loon/sooyaaabo/CheLaiLe.lpx",
                  "Modules/Loon/ishowshu/cmbchina.lpx", "Modules/Loon/ishowshu/didi.lpx",
                  "Modules/Loon/ishowshu/github.lpx", "Modules/Loon/ishowshu/goofish.lpx",
                  "Modules/Loon/ishowshu/hupu.lpx", "Modules/Loon/ishowshu/jd.lpx",
                  "Modules/Loon/ishowshu/keep.lpx", "Modules/Loon/ishowshu/leisu.lpx",
                  "Modules/Loon/ZenmoFeiShi/MT.lpx", "Modules/Loon/ishowshu/pdd-filter.lpx",
                  "Modules/Loon/ishowshu/pdd-rewrite.lpx", "Modules/Loon/ishowshu/pupu.lpx",
                  "Modules/Loon/ccyykk666/qunar_ad.lpx", "Modules/Loon/ishowshu/soul.lpx",
                  "Modules/Loon/ishowshu/taobao.lpx", "Modules/Loon/ddgksf2013/UmetripAds.lpx",
                  "Modules/Loon/Maasea/YouTube.Enhance.lpx"
              ],
              "compatibility_key": "aoomee (retained only to preserve historical provenance continuity)"
          })
          source = report.get("GuaZiVideoAds")
          if not isinstance(source, dict):
              raise SystemExit("source-report.json 缺少 GuaZiVideoAds 校验结果")
          source.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "upstream_path": "Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf",
          })
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python3 amap_dependency_guard.py --assets /tmp/amap --plugin /tmp/amap/Amap.lpx --commit "$ROMEO_SHA" --report source-report.json
          python3 apply_amap_local_overrides.py --plugin /tmp/amap/Amap.lpx
          cp /tmp/amap/* sources/amap/

      - name: 合并各来源去广告规则（临时目录）
        run: python3 merge_plugins.py --base /tmp/loon-build/allAdRewrite.plugin --extra fetch --filter fetch --apps /tmp/loon-plugins --romeo-plugins /tmp/romeo --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --myblockads fetch --alipayadblock sources/alipayAdBlock/alipayAdBlock.lpx --out /tmp/loon-build/allAdRewrite.plugin --provenance-out /tmp/loon-build/rule-provenance.json --source-report source-report.json

      - name: 保存合并阶段产物用于最终来源追溯
        run: cp /tmp/loon-build/allAdRewrite.plugin /tmp/loon-build/allAdRewrite.after-merge.plugin

      - name: 提取并整合 Spotify 去广告规则（随上游每日更新）
        run: |
          python3 integrate_spotify.py --plugin /tmp/loon-build/allAdRewrite.plugin --source-plugin sources/spotify/Spotify.lpx --scripts-source /tmp/spotify-scripts --scripts-dest scripts/spotify --upstream-commit "$SPOTIFY_SHA" --metadata sources/spotify/upstream.json
          cp /tmp/loon-build/allAdRewrite.plugin /tmp/loon-build/allAdRewrite.after-spotify.plugin

      - name: 应用本地 App 规则覆盖（防止上游合并时丢失）
        run: |
          python3 apply_local_overrides.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 finalize_provenance.py --before /tmp/loon-build/allAdRewrite.after-merge.plugin --after-spotify /tmp/loon-build/allAdRewrite.after-spotify.plugin --final /tmp/loon-build/allAdRewrite.plugin --provenance /tmp/loon-build/rule-provenance.json

      - name: 校验临时产物并同步 README 统计
        run: python3 validate_plugin.py /tmp/loon-build/allAdRewrite.plugin --update-readme README.md

      - name: 自动比较上游规则新增、删除与动作变化
        run: python3 compare_rule_provenance.py --previous /tmp/loon-build/rule-provenance.previous.json --current /tmp/loon-build/rule-provenance.json --out /tmp/loon-build/rule-diff.json

      - name: 来源可靠性评分与异常更新发布门禁
        run: |
          python3 source_health_guard.py --previous-sources /tmp/loon-build/source-report.previous.json --current-sources source-report.json --previous-provenance /tmp/loon-build/rule-provenance.previous.json --current-provenance /tmp/loon-build/rule-provenance.json --diff /tmp/loon-build/rule-diff.json --out /tmp/loon-build/source-health.json

      - name: 规则变更风险分级与来源历史趋势
        run: |
          python3 rule_risk_history.py --diff /tmp/loon-build/rule-diff.json --health /tmp/loon-build/source-health.json --source-report source-report.json --provenance /tmp/loon-build/rule-provenance.json --previous-history /tmp/loon-build/rule-history.previous.json --run-id "$GITHUB_RUN_ID" --risk-out /tmp/loon-build/rule-risk.json --history-out /tmp/loon-build/rule-history.json

      - name: 只读审计 UDP、MITM 与 Script 风险
        run: |
          python3 audit_plugin.py /tmp/loon-build/allAdRewrite.plugin --summary-only
          python3 deep_audit.py /tmp/loon-build/allAdRewrite.plugin --summary-only
          python3 deep_audit.py /tmp/loon-build/allAdRewrite.plugin --json /tmp/deep-audit-sync.json --markdown /tmp/deep-audit-sync.md

      - name: 上传同步构建规则来源追溯报告
        uses: actions/upload-artifact@v4
        with:
          name: rule-provenance-${{ github.run_id }}
          path: /tmp/loon-build/rule-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传规则变更差异报告
        uses: actions/upload-artifact@v4
        with:
          name: rule-diff-${{ github.run_id }}
          path: /tmp/loon-build/rule-diff.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传来源可靠性与异常检测报告
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: /tmp/loon-build/source-health.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传规则风险分级报告与历史趋势
        uses: actions/upload-artifact@v4
        with:
          name: rule-risk-history-${{ github.run_id }}
          path: |
            /tmp/loon-build/rule-risk.json
            /tmp/loon-build/rule-history.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传同步构建深度审计报告
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-sync-${{ github.run_id }}
          path: |
            /tmp/deep-audit-sync.json
            /tmp/deep-audit-sync.md
          if-no-files-found: error
          retention-days: 14

      - name: 校验通过后替换正式产物
        run: |
          cp /tmp/loon-build/allAdRewrite.plugin allAdRewrite.plugin.tmp && mv allAdRewrite.plugin.tmp allAdRewrite.plugin
          cp /tmp/loon-build/allAdBlock-Loon.plugin allAdBlock-Loon.plugin.tmp && mv allAdBlock-Loon.plugin.tmp allAdBlock-Loon.plugin
          cp /tmp/loon-build/allAdBlock-Loon.list allAdBlock-Loon.list.tmp && mv allAdBlock-Loon.list.tmp allAdBlock-Loon.list
          cp /tmp/loon-build/rule-provenance.json rule-provenance.json
          cp /tmp/loon-build/rule-diff.json rule-diff.json
          cp /tmp/loon-build/source-health.json source-health.json
          cp /tmp/loon-build/rule-risk.json rule-risk.json
          cp /tmp/loon-build/rule-history.json rule-history.json

      # 可选网络检查：仅输出警告，不因上游短暂限流阻断规则同步。
      # 本地排查远程脚本：python3 validate_plugin.py allAdRewrite.plugin --check-remote
      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- allAdRewrite.plugin allAdBlock-Loon.plugin allAdBlock-Loon.list README.md myblockads.lpx source-report.json rule-provenance.json rule-diff.json source-health.json rule-risk.json rule-history.json sources/amap/ sources/spotify/ sources/alipayAdBlock/ scripts/spotify/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并产物与统计均无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allAdRewrite.plugin allAdBlock-Loon.plugin allAdBlock-Loon.list README.md myblockads.lpx source-report.json rule-provenance.json rule-diff.json source-health.json rule-risk.json rule-history.json sources/amap/ sources/spotify/ sources/alipayAdBlock/ scripts/spotify/
          git commit -m "chore: sync upstream rules and plugin stats $(date -u +%Y-%m-%d)"
          # Another workflow or a PR merge may advance main after checkout.
          # Rebase the generated snapshot onto the latest main before pushing;
          # never force-push or overwrite concurrent changes.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Sync commit conflicts with newer main; rerun the full sync from the latest revision."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt rejected; refreshing main and retrying."
            sleep 2
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
