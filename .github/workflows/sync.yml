name: Sync multi-source ad-block plugins (QuanX -> Loon)

# 上游 R-Store、blockAdsV2、Thelongdarkorg、aoomee、zmjde、adultraplus 每天更新，这里每天同步两次做容错
on:
  # 错开整点：GitHub 定时任务在整点（尤其 0 分）全球高负载，最容易被延迟或丢弃
  schedule:
    - cron: '7 1 * * *'      # UTC 01:07 = 北京时间 09:07
    - cron: '23 13 * * *'    # UTC 13:23 = 北京时间 21:23
  workflow_dispatch:         # 也可在 Actions 页面手动点「Run workflow」立即同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 重写规则 -> allAdRewrite.plugin（R-Store 转换产物，作为合并 base）
      - name: 转换重写规则
        run: python3 convert_qx2loon.py -o allAdRewrite.plugin

      # 拉取 Thelongdarkorg/loon-plugins（29 个细分 App 去广告插件），供并入去重
      - name: 拉取 Thelongdarkorg 去广告插件
        run: |
          git clone --depth 1 https://github.com/Thelongdarkorg/loon-plugins.git /tmp/loon-plugins
          ls /tmp/loon-plugins/*_ad_block.plugin /tmp/loon-plugins/*_splash_ad_block.plugin | wc -l

      # 拉取 aoomee/Loon-Adblock-Plugins（.plugin/.lpx 独立 App 插件，含远程脚本），供并入去重
      - name: 拉取 aoomee 去广告插件
        run: |
          git clone --depth 1 https://github.com/aoomee/Loon-Adblock-Plugins.git /tmp/aoomee
          ls /tmp/aoomee/plugins | wc -l

      # 拉取 zmjde/loon-plugins（.lpx），取其中 4 个：滴滴/拼多多 App 插件 + HTTPDNS/广告平台通用拦截器
      - name: 拉取 zmjde 去广告插件
        run: |
          git clone --depth 1 https://github.com/zmjde/loon-plugins.git /tmp/zmjde
          ls /tmp/zmjde/Plugin | wc -l

      # 合并 blockAdsV2 + Thelongdarkorg + aoomee + zmjde + adultraplus 并补全分流。
      # 优先级：zmjde App(滴滴/拼多多) > aoomee > Thelongdarkorg > R-Store base > blockAdsV2
      #   > zmjde 通用(HTTPDNS/广告平台，base 优先只补) > adultraplus；
      # 同正则同动作按优先级替换，同正则互补动作（jq+header 等）并存；adultraplus 清洗（只取 reject 家族）
      - name: 合并各来源去广告插件与分流规则
        run: python3 merge_plugins.py --base allAdRewrite.plugin --extra fetch --filter fetch --apps /tmp/loon-plugins --aoomee /tmp/aoomee --zmjde /tmp/zmjde --mix fetch --out allAdRewrite.plugin

      # 产物自检：发现非法主机名/未知动作即失败，阻止错误产物被提交
      - name: 校验重写插件
        run: python3 validate_plugin.py allAdRewrite.plugin

      # 判定对象是【最终合并产物】allAdRewrite.plugin：任一来源（R-Store/block/aoomee/zmjde/mix）
      # 导致它变化都会触发提交，不要求 base 单独变化；无任何变化才跳过，不产生空提交。
      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- allAdRewrite.plugin; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并产物无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到合并产物更新："
            git diff --stat
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allAdRewrite.plugin
          git commit -m "chore: sync upstream rules $(date -u +%Y-%m-%d)"
          git push
#（注：内容由AI生成）
