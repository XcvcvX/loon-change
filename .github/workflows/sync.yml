name: Sync multi-source ad-block plugins (QuanX -> Loon)

on:
  push:
    branches: [main]
    paths:
      - 'merge_plugins.py'
      - 'source_guard.py'
      - 'amap_dependency_guard.py'
      - 'compare_rule_provenance.py'
      - 'source_health_guard.py'
      - 'rule_risk_history.py'
      - 'convert_qx2loon.py'
      - 'convert_filter_qx2loon.py'
      - '.github/workflows/sync.yml'
  pull_request:
    paths:
      - 'validate_plugin.py'
      - 'source_guard.py'
      - 'merge_plugins.py'
      - 'test_merge_plugins.py'
      - 'test_validate_plugin.py'
      - 'test_source_guard.py'
      - 'audit_plugin.py'
      - 'test_audit_plugin.py'
      - 'deep_audit.py'
      - 'test_deep_audit.py'
      - 'amap_dependency_guard.py'
      - 'test_amap_dependency_guard.py'
      - 'compare_rule_provenance.py'
      - 'test_compare_rule_provenance.py'
      - 'source_health_guard.py'
      - 'test_source_health_guard.py'
      - 'rule_risk_history.py'
      - 'test_rule_risk_history.py'
      - '.github/workflows/sync.yml'
      - 'README.md'
      - 'sources/amap/**'
  schedule:
    - cron: '7 1 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py validate_plugin.py source_guard.py audit_plugin.py deep_audit.py amap_dependency_guard.py compare_rule_provenance.py source_health_guard.py rule_risk_history.py convert_qx2loon.py convert_filter_qx2loon.py
      - name: 运行单元与合并集成测试
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py test_deep_audit.py test_amap_dependency_guard.py test_compare_rule_provenance.py test_source_health_guard.py test_rule_risk_history.py
      - name: 审计当前插件风险摘要
        run: |
          python3 audit_plugin.py allAdRewrite.plugin --summary-only
          python3 deep_audit.py allAdRewrite.plugin --summary-only
          python3 deep_audit.py allAdRewrite.plugin --json /tmp/deep-audit.json --markdown /tmp/deep-audit.md
      - name: 上传深度审计报告
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-report
          path: |
            /tmp/deep-audit.json
            /tmp/deep-audit.md
          if-no-files-found: error

  sync:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py validate_plugin.py source_guard.py audit_plugin.py deep_audit.py amap_dependency_guard.py convert_qx2loon.py convert_filter_qx2loon.py

      - name: 测试校验器与来源依赖门禁
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py test_deep_audit.py test_amap_dependency_guard.py

      - name: 创建隔离构建目录
        run: |
          mkdir -p /tmp/loon-build
          if [ -s source-report.json ]; then
            cp source-report.json /tmp/loon-build/source-report.previous.json
          else
            printf '{}' > /tmp/loon-build/source-report.previous.json
          fi
          if [ -s rule-history.json ]; then
            cp rule-history.json /tmp/loon-build/rule-history.previous.json
          else
            printf '{\"schema_version\":1,\"snapshots\":[]}' > /tmp/loon-build/rule-history.previous.json
          fi
          if [ -s rule-provenance.json ]; then
            cp rule-provenance.json /tmp/loon-build/rule-provenance.previous.json
          else
            printf '{"schema_version":1,"upstream_revisions":{},"rewrite":[],"script":[],"rule_events":[]}' > /tmp/loon-build/rule-provenance.previous.json
          fi

      - name: 转换重写规则（先写入临时产物）
        run: python3 convert_qx2loon.py -o /tmp/loon-build/allAdRewrite.plugin

      - name: 拉取 Thelongdarkorg 去广告插件
        run: |
          git clone --depth 1 https://github.com/Thelongdarkorg/loon-plugins.git /tmp/loon-plugins
          ls /tmp/loon-plugins/*_ad_block.plugin /tmp/loon-plugins/*_splash_ad_block.plugin | wc -l

      - name: 拉取 aoomee 去广告插件
        run: |
          git clone --depth 1 https://github.com/aoomee/Loon-Adblock-Plugins.git /tmp/aoomee
          ls /tmp/aoomee/plugins | wc -l

      - name: 拉取 zmjde 去广告插件
        run: |
          git clone --depth 1 https://github.com/zmjde/loon-plugins.git /tmp/zmjde
          ls /tmp/zmjde/Plugin | wc -l

      - name: 下载瓜子影视去广告
        run: |
          curl -fsSL --retry 5 --retry-all-errors -A "surge" \
            https://ddgksf2013.top/rewrite/GuaZiVideoAds.conf -o /tmp/GuaZiVideoAds.conf
          wc -c /tmp/GuaZiVideoAds.conf

      - name: 固定 Romeo 上游版本并下载高德插件及依赖
        run: |
          mkdir -p /tmp/amap sources/amap
          git clone --depth 1 https://github.com/ifflagged/Romeo.git /tmp/romeo
          ROMEO_SHA="$(git -C /tmp/romeo rev-parse HEAD)"
          echo "ROMEO_SHA=$ROMEO_SHA" >> "$GITHUB_ENV"
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/sooyaaabo/Amap.lpx" > /tmp/amap/Amap.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/rucu6_amap.js" > /tmp/amap/rucu6_amap.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/loon_Amap.recommend.jq" > /tmp/amap/loon_Amap.recommend.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_updatable.jq" > /tmp/amap/updatable.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_search_poi_detail.jq" > /tmp/amap/search_poi_detail.jq
          echo "Romeo pinned commit: $ROMEO_SHA"
          wc -c /tmp/amap/*

      - name: 校验克隆来源并生成来源报告
        run: |
          python3 source_guard.py --thelong /tmp/loon-plugins --aoomee /tmp/aoomee --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --previous-report source-report.json --report source-report.json
          python3 amap_dependency_guard.py --assets /tmp/amap --plugin /tmp/amap/Amap.lpx --commit "$ROMEO_SHA" --report source-report.json
          cp /tmp/amap/* sources/amap/

      - name: 合并各来源去广告规则（临时目录）
        run: python3 merge_plugins.py --base /tmp/loon-build/allAdRewrite.plugin --extra fetch --filter fetch --apps /tmp/loon-plugins --aoomee /tmp/aoomee --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --myblockads fetch --out /tmp/loon-build/allAdRewrite.plugin --provenance-out /tmp/loon-build/rule-provenance.json --source-report source-report.json

      - name: 校验临时产物并同步 README 统计
        run: python3 validate_plugin.py /tmp/loon-build/allAdRewrite.plugin --update-readme README.md

      - name: 自动比较上游规则新增、删除与动作变化
        run: python3 compare_rule_provenance.py --previous /tmp/loon-build/rule-provenance.previous.json --current /tmp/loon-build/rule-provenance.json --out /tmp/loon-build/rule-diff.json

      - name: 来源可靠性评分与异常更新发布门禁
        run: |
          python3 source_health_guard.py --previous-sources /tmp/loon-build/source-report.previous.json --current-sources source-report.json --previous-provenance /tmp/loon-build/rule-provenance.previous.json --current-provenance /tmp/loon-build/rule-provenance.json --diff /tmp/loon-build/rule-diff.json --out /tmp/loon-build/source-health.json

      - name: 规则变更风险分级与来源历史趋势
        run: |
          python3 rule_risk_history.py --diff /tmp/loon-build/rule-diff.json --health /tmp/loon-build/source-health.json --source-report source-report.json --previous-history /tmp/loon-build/rule-history.previous.json --run-id \"$GITHUB_RUN_ID\" --risk-out /tmp/loon-build/rule-risk.json --history-out /tmp/loon-build/rule-history.json

      - name: 只读审计 UDP、MITM 与 Script 风险
        run: |
          python3 audit_plugin.py /tmp/loon-build/allAdRewrite.plugin --summary-only
          python3 deep_audit.py /tmp/loon-build/allAdRewrite.plugin --summary-only
          python3 deep_audit.py /tmp/loon-build/allAdRewrite.plugin --json /tmp/deep-audit-sync.json --markdown /tmp/deep-audit-sync.md

      - name: 上传同步构建规则来源追溯报告
        uses: actions/upload-artifact@v4
        with:
          name: rule-provenance-${{ github.run_id }}
          path: /tmp/loon-build/rule-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传规则变更差异报告
        uses: actions/upload-artifact@v4
        with:
          name: rule-diff-${{ github.run_id }}
          path: /tmp/loon-build/rule-diff.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传来源可靠性与异常检测报告
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: /tmp/loon-build/source-health.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传规则风险分级报告与历史趋势
        uses: actions/upload-artifact@v4
        with:
          name: rule-risk-history-${{ github.run_id }}
          path: |
            /tmp/loon-build/rule-risk.json
            /tmp/loon-build/rule-history.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传同步构建深度审计报告
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-sync-${{ github.run_id }}
          path: |
            /tmp/deep-audit-sync.json
            /tmp/deep-audit-sync.md
          if-no-files-found: error
          retention-days: 14

      - name: 校验通过后替换正式产物
        run: |
          cp /tmp/loon-build/allAdRewrite.plugin allAdRewrite.plugin.tmp && mv allAdRewrite.plugin.tmp allAdRewrite.plugin
          cp /tmp/loon-build/rule-provenance.json rule-provenance.json
          cp /tmp/loon-build/rule-diff.json rule-diff.json
          cp /tmp/loon-build/source-health.json source-health.json
          cp /tmp/loon-build/rule-risk.json rule-risk.json
          cp /tmp/loon-build/rule-history.json rule-history.json

      # 可选网络检查：仅输出警告，不因上游短暂限流阻断规则同步。
      # 本地排查远程脚本：python3 validate_plugin.py allAdRewrite.plugin --check-remote
      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- allAdRewrite.plugin README.md source-report.json rule-provenance.json rule-diff.json source-health.json rule-risk.json rule-history.json sources/amap/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并产物与统计均无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allAdRewrite.plugin README.md source-report.json rule-provenance.json rule-diff.json source-health.json rule-risk.json rule-history.json sources/amap/
          git commit -m "chore: sync upstream rules and plugin stats $(date -u +%Y-%m-%d)"
          git push
