name: Sync multi-source ad-block plugins (QuanX -> Loon)

on:
  pull_request:
    paths:
      - 'validate_plugin.py'
      - 'merge_plugins.py'
      - 'test_merge_plugins.py'
      - 'test_validate_plugin.py'
      - '.github/workflows/sync.yml'
      - 'README.md'
  schedule:
    - cron: '7 1 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py validate_plugin.py convert_qx2loon.py convert_filter_qx2loon.py
      - name: 运行单元与合并集成测试
        run: python3 -m unittest -v test_validate_plugin.py test_merge_plugins.py test_merge_plugins.py

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 测试校验器
        run: python3 -m unittest -v test_validate_plugin.py

      - name: 转换重写规则
        run: python3 convert_qx2loon.py -o allAdRewrite.plugin

      - name: 拉取 Thelongdarkorg 去广告插件
        run: |
          git clone --depth 1 https://github.com/Thelongdarkorg/loon-plugins.git /tmp/loon-plugins
          ls /tmp/loon-plugins/*_ad_block.plugin /tmp/loon-plugins/*_splash_ad_block.plugin | wc -l

      - name: 拉取 aoomee 去广告插件
        run: |
          git clone --depth 1 https://github.com/aoomee/Loon-Adblock-Plugins.git /tmp/aoomee
          ls /tmp/aoomee/plugins | wc -l

      - name: 拉取 zmjde 去广告插件
        run: |
          git clone --depth 1 https://github.com/zmjde/loon-plugins.git /tmp/zmjde
          ls /tmp/zmjde/Plugin | wc -l

      - name: 下载瓜子影视去广告
        run: |
          curl -fsSL --retry 5 --retry-all-errors -A "surge" \
            https://ddgksf2013.top/rewrite/GuaZiVideoAds.conf -o /tmp/GuaZiVideoAds.conf
          wc -c /tmp/GuaZiVideoAds.conf

      - name: 合并各来源去广告插件与分流规则
        run: python3 merge_plugins.py --base allAdRewrite.plugin --extra fetch --filter fetch --apps /tmp/loon-plugins --aoomee /tmp/aoomee --zmjde /tmp/zmjde --qxapp /tmp/GuaZiVideoAds.conf --myblockads fetch --out allAdRewrite.plugin

      - name: 校验重写插件并同步 README 统计
        run: python3 validate_plugin.py allAdRewrite.plugin --update-readme README.md

      # 可选网络检查：仅输出警告，不因上游短暂限流阻断规则同步。
      # 本地排查远程脚本：python3 validate_plugin.py allAdRewrite.plugin --check-remote
      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- allAdRewrite.plugin README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并产物与统计均无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allAdRewrite.plugin README.md
          git commit -m "chore: sync upstream rules and plugin stats $(date -u +%Y-%m-%d)"
          git push
