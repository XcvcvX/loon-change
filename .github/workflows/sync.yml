permissions:
  contents: read

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 生成小红书主响应本地优化脚本
        run: |
          git clone --depth 1 https://github.com/fmz200/wool_scripts.git /tmp/wool_scripts-check
          WOOL_SHA="$(git -C /tmp/wool_scripts-check rev-parse HEAD)"
          python3 optimize_xiaohongshu.py --source /tmp/wool_scripts-check/Scripts/xiaohongshu/xiaohongshu.js --output scripts/xiaohongshu/xiaohongshu.js --upstream-commit "$WOOL_SHA"

      - name: 生成知乎本地优化响应脚本
        run: |
          git clone --depth 1 https://github.com/zirawell/R-Store.git /tmp/r-store-check
          RSTORE_SHA="$(git -C /tmp/r-store-check rev-parse HEAD)"
          python3 optimize_zhihu.py --source /tmp/r-store-check/Res/Scripts/AntiAd/zhihu.js --output scripts/zhihu/zhihu.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_cntv.py --source /tmp/r-store-check/Res/Scripts/AntiAd/cntv.js --output scripts/cntv/cntv.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_amap.py --source /tmp/r-store-check/Res/Scripts/AntiAd/amap.js --output scripts/amap/amap.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_didi.py --source /tmp/r-store-check/Res/Scripts/AntiAd/didi.js --output scripts/didi/didi.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_xiaohongshu_rstore.py --source /tmp/r-store-check/Res/Scripts/AntiAd/xiaohongshu.js --output scripts/xiaohongshu/xiaohongshu-rstore.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_weibo_rstore.py --source /tmp/r-store-check/Res/Scripts/AntiAd/weibo.js --output scripts/weibo/weibo-rstore.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_smzdm.py --source /tmp/r-store-check/Res/Scripts/AntiAd/smzdm.js --output scripts/smzdm/smzdm.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_rrtv.py --source /tmp/r-store-check/Res/Scripts/AntiAd/rrtv.js --output scripts/rrtv/rrtv.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_soul.py --source /tmp/r-store-check/Res/Scripts/AntiAd/soul.js --output scripts/soul/soul.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_xmly.py --source /tmp/r-store-check/Res/Scripts/AntiAd/xmly.js --output scripts/xmly/xmly.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_dushu365.py --source /tmp/r-store-check/Res/Scripts/AntiAd/dushu365.js --output scripts/dushu365/dushu365.js --upstream-commit "$RSTORE_SHA"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查本地性能优化未被上游覆盖
        run: python3 optimization_guard.py

      - name: 验证 Romeo 插件映射与本地快照
        run: |
          git clone --depth 1 https://github.com/ifflagged/Romeo.git /tmp/romeo-check
          ROMEO_CHECK_SHA="$(git -C /tmp/romeo-check rev-parse HEAD)"
          python3 stage_romeo_plugins.py --romeo-repo /tmp/romeo-check --commit "$ROMEO_CHECK_SHA" --output /tmp/romeo-check/plugins --zmjde-output /tmp/romeo-check-zmjde/Plugin
          python3 - <<'PY'
          import json
          from pathlib import Path
          from source_guard import validate_plugin_file
          from stage_romeo_plugins import EXPECTED_PLUGIN_FILES, ZMJDE_PLUGIN_MAP, RUNTIME_ASSETS
          paths = sorted(Path("/tmp/romeo-check/plugins").glob("*"))
          paths = [p for p in paths if p.suffix.lower() in (".lpx", ".plugin")]
          zm_paths = sorted(Path("/tmp/romeo-check-zmjde/Plugin").glob("*.lpx"))
          total = sum(validate_plugin_file(p, str(p)) for p in paths)
          zm_total = sum(validate_plugin_file(p, str(p)) for p in zm_paths)
          if len(paths) != EXPECTED_PLUGIN_FILES or total < 169:
              raise SystemExit("Romeo/AOOMEE compatibility feed incomplete: files=%d, valid_entries=%d" % (len(paths), total))
          if len(zm_paths) != len(ZMJDE_PLUGIN_MAP) or zm_total < 10:
              raise SystemExit("Romeo/zmjde compatibility feed incomplete: files=%d, valid_entries=%d" % (len(zm_paths), zm_total))
          meta = json.loads(Path("/tmp/romeo-check-zmjde/Plugin/.romeo-source.json").read_text())
          for asset in RUNTIME_ASSETS:
              slot_dir = Path("/tmp/romeo-check/plugins") if asset["slot"] == "aoomee_compat" else Path("/tmp/romeo-check-zmjde/Plugin")
              plugin = slot_dir / asset["plugin"]
              expected = "https://raw.githubusercontent.com/ifflagged/Romeo/" + meta["upstream_commit"] + "/" + asset["source_path"]
              if expected not in plugin.read_text(encoding="utf-8"):
                  raise SystemExit("Unpinned runtime asset in " + asset["plugin"] + ": " + asset["source_path"])
          print("Romeo feeds validated: %d + %d plugins; %d entries" % (len(paths), len(zm_paths), total + zm_total))
          PY

      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py mitm_policy.py validate_plugin.py fix_script_configs.py source_guard.py stage_romeo_plugins.py audit_plugin.py deep_audit.py amap_dependency_guard.py apply_amap_local_overrides.py compare_rule_provenance.py source_health_guard.py finalize_provenance.py rule_risk_history.py convert_qx2loon.py convert_filter_qx2loon.py integrate_spotify.py apply_local_overrides.py check_script_v2.py runtime_performance_audit.py optimize_cnftp.py optimize_xiaohongshu.py optimize_xiaohongshu_rstore.py optimize_weibo_rstore.py optimize_zhihu.py optimize_cntv.py optimize_amap.py optimize_smzdm.py optimize_rrtv.py optimize_soul.py optimize_xmly.py optimize_didi.py optimize_taobao.py optimization_guard.py
      - name: 检查小红书本地视频脚本语法
        run: node --check scripts/xiaohongshu/xiaohongshu-v4.js
      - name: 检查小红书主响应脚本语法
        run: node --check scripts/xiaohongshu/xiaohongshu.js
      - name: 检查 R-Store 小红书本地响应脚本语法
        run: node --check scripts/xiaohongshu/xiaohongshu-rstore.js
      - name: 检查 R-Store 微博本地响应脚本语法
        run: node --check scripts/weibo/weibo-rstore.js
      - name: 检查知乎本地响应脚本语法
        run: node --check scripts/zhihu/zhihu.js
      - name: 检查高德本地响应脚本语法
        run: node --check sources/amap/rucu6_amap.js
      - name: 检查 CNFTP 本地响应脚本语法
        run: node --check scripts/cnftp/cnftp.js
      - name: 检查 CNTV 本地响应脚本语法
        run: node --check scripts/cntv/cntv.js
      - name: 检查 R-Store 高德本地响应脚本语法
        run: node --check scripts/amap/amap.js
      - name: 检查滴滴本地响应脚本语法
        run: node --check scripts/didi/didi.js
      - name: 检查京东本地响应脚本语法
        run: node --check scripts/jingdong/jd.js
      - name: 检查什么值得买本地响应脚本语法
        run: node --check scripts/smzdm/smzdm.js
      - name: 检查人人视频本地响应脚本语法
        run: node --check scripts/rrtv/rrtv.js
      - name: 检查 Soul 本地响应脚本语法
        run: node --check scripts/soul/soul.js
      - name: 检查喜马拉雅本地响应脚本语法
        run: node --check scripts/xmly/xmly.js
      - name: 检查帆书本地响应脚本语法
        run: node --check scripts/dushu365/dushu365.js
      - name: 运行单元与合并集成测试
        run: python3 -m unittest -v test_validate_plugin.py test_fix_script_configs.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py test_deep_audit.py test_mitm_policy.py test_amap_dependency_guard.py test_apply_amap_local_overrides.py test_compare_rule_provenance.py test_source_health_guard.py test_finalize_provenance.py test_rule_risk_history.py test_integrate_spotify.py test_convert_qx2loon.py test_convert_filter_qx2loon.py test_stage_romeo_plugins.py test_runtime_performance_audit.py test_xiaohongshu_v4_performance.py test_xiaohongshu_performance.py test_xiaohongshu_rstore_performance.py test_weibo_rstore_performance.py test_amap_response_compaction.py test_cnftp_performance.py test_zhihu_performance.py test_bilibili_json_performance.py test_cntv_performance.py test_amap_rstore_performance.py test_didi_performance.py test_response_array_compaction_performance.py test_baidumap_binary_performance.py test_taobao_optimization.py test_xianyu_jd_upstream.py test_jd_lazy_serialization.py test_optimization_guard.py test_smzdm_performance.py test_rrtv_performance.py test_soul_performance.py test_xmly_performance.py test_dushu365_performance.py
      - name: 测试本地插件覆盖
        run: |
          # The checked-in plugin is a historical snapshot; snapshot-specific assertions
          # are validated against the freshly built artifact in the sync job instead.
          # Keep all transformation/fixture tests, excluding only stale snapshot assertions.
          python3 - <<'PY'
          import unittest
          import test_apply_local_overrides
          import test_integrate_spotify

          stale_snapshot_tests = {
              "test_generated_plugin_has_no_legacy_amap_scripts_and_keeps_native_handlers",
              "test_checked_in_plugin_snapshot_has_only_the_selected_handlers",
              "test_checked_in_plugin_applies_non_ad_pruning_without_losing_ad_handlers",
              "test_checked_in_plugin_snapshot_has_only_the_canonical_handlers",
              "test_generated_plugin_does_not_reject_didi_homepage_before_field_cleaning",
              "test_generated_plugin_keeps_only_gated_baidumap_ad_trigger",
              "test_generated_plugin_keeps_only_live_didi_scripts_and_native_homepage_cleaners",
              "test_generated_plugin_uses_only_switch_gated_dianping_triggers",
              "test_checked_in_plugin_snapshot_has_only_the_canonical_entries",
              "test_checked_in_snapshot_matches_optimized_weibo_trigger_inventory",
              "test_checked_in_plugin_apply_keeps_single_onboard_handler",
              "test_fails_closed_on_duplicate_known_handlers_and_ignores_other_sections",
              "test_preserves_romeo_handler_when_wool_canonical_is_missing",
              "test_removes_only_the_duplicate_romeo_onboard_handler",
              "test_checked_in_plugin_snapshot_allows_core_services_and_keeps_ad_rules",
              "test_checked_in_plugin_has_no_vip_paywall_or_teen_mode_bypass",
              "test_checked_in_plugin_snapshot_keeps_ad_paths_without_content_cdn_overblocks",
              "test_checked_in_plugin_applies_all_header_only_body_read_cleanups",
              "test_checked_in_plugin_uses_local_pupu_handlers_and_has_no_romeo_duplicate",
              "test_checked_in_plugin_uses_only_local_exact_pupu_triggers",
              "test_checked_in_plugin_snapshot_applies_to_native_ad_only_rules",
              "test_checked_in_plugin_removes_only_shadowed_amdc_entry",
              "test_checked_in_plugin_snapshot_has_only_the_three_canonical_triggers",
              "test_checked_in_plugin_applies_usmile_body_read_cleanup",
          }

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          loader = unittest.defaultTestLoader
          cases = list(flatten(loader.loadTestsFromModule(test_apply_local_overrides)))
          cases += list(flatten(loader.loadTestsFromModule(test_integrate_spotify)))
          selected = [case for case in cases if case._testMethodName not in stale_snapshot_tests]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          raise SystemExit(not result.wasSuccessful())
          PY
          python3 apply_local_overrides.py --plugin allAdRewrite.plugin
          python3 fix_script_configs.py --plugin allAdRewrite.plugin
          python3 check_script_v2.py allAdRewrite.plugin
      - name: 审计当前插件风险摘要
        run: |
          python3 audit_plugin.py allAdRewrite.plugin --summary-only
          python3 deep_audit.py allAdRewrite.plugin --summary-only
          python3 deep_audit.py allAdRewrite.plugin --json /tmp/deep-audit.json --markdown /tmp/deep-audit.md
          python3 runtime_performance_audit.py allAdRewrite.plugin --summary-only
          python3 runtime_performance_audit.py allAdRewrite.plugin --json /tmp/runtime-performance.json --markdown /tmp/runtime-performance.md
      - name: 上传深度审计报告
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-report
          path: |
            /tmp/deep-audit.json
            /tmp/deep-audit.md
            /tmp/runtime-performance.json
            /tmp/runtime-performance.md
          if-no-files-found: error

  sync:
    # Run the complete production build as a PR preflight for same-repository branches.
    # Only the publish step is disabled for PR events.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      # Serialize/cancel stale production runs on main; give each PR preflight its own slot.
      group: ${{ github.ref == 'refs/heads/main' && 'loon-change-main-sync' || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 获取并优化 CNFTP 本地响应脚本
        run: |
          git clone --depth 1 https://github.com/fmz200/wool_scripts.git /tmp/wool_scripts
          WOOL_SHA="$(git -C /tmp/wool_scripts rev-parse HEAD)"
          python3 optimize_cnftp.py --source /tmp/wool_scripts/Scripts/cnftp.js --output scripts/cnftp/cnftp.js --upstream-commit "$WOOL_SHA"
          python3 optimize_xiaohongshu.py --source /tmp/wool_scripts/Scripts/xiaohongshu/xiaohongshu.js --output scripts/xiaohongshu/xiaohongshu.js --upstream-commit "$WOOL_SHA"
          git clone --depth 1 https://github.com/zirawell/R-Store.git /tmp/r-store
          RSTORE_SHA="$(git -C /tmp/r-store rev-parse HEAD)"
          python3 optimize_zhihu.py --source /tmp/r-store/Res/Scripts/AntiAd/zhihu.js --output scripts/zhihu/zhihu.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_cntv.py --source /tmp/r-store/Res/Scripts/AntiAd/cntv.js --output scripts/cntv/cntv.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_amap.py --source /tmp/r-store/Res/Scripts/AntiAd/amap.js --output scripts/amap/amap.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_didi.py --source /tmp/r-store/Res/Scripts/AntiAd/didi.js --output scripts/didi/didi.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_xiaohongshu_rstore.py --source /tmp/r-store/Res/Scripts/AntiAd/xiaohongshu.js --output scripts/xiaohongshu/xiaohongshu-rstore.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_weibo_rstore.py --source /tmp/r-store/Res/Scripts/AntiAd/weibo.js --output scripts/weibo/weibo-rstore.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_smzdm.py --source /tmp/r-store/Res/Scripts/AntiAd/smzdm.js --output scripts/smzdm/smzdm.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_rrtv.py --source /tmp/r-store/Res/Scripts/AntiAd/rrtv.js --output scripts/rrtv/rrtv.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_soul.py --source /tmp/r-store/Res/Scripts/AntiAd/soul.js --output scripts/soul/soul.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_xmly.py --source /tmp/r-store/Res/Scripts/AntiAd/xmly.js --output scripts/xmly/xmly.js --upstream-commit "$RSTORE_SHA"
          python3 optimize_dushu365.py --source /tmp/r-store/Res/Scripts/AntiAd/dushu365.js --output scripts/dushu365/dushu365.js --upstream-commit "$RSTORE_SHA"
          echo "CNFTP upstream: fmz200/wool_scripts@$WOOL_SHA"


      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译检查
        run: python3 -m py_compile merge_plugins.py mitm_policy.py validate_plugin.py fix_script_configs.py source_guard.py stage_romeo_plugins.py audit_plugin.py deep_audit.py amap_dependency_guard.py apply_amap_local_overrides.py compare_rule_provenance.py source_health_guard.py finalize_provenance.py rule_risk_history.py convert_qx2loon.py convert_filter_qx2loon.py integrate_spotify.py runtime_performance_audit.py optimize_cnftp.py optimize_xiaohongshu.py optimize_xiaohongshu_rstore.py optimize_weibo_rstore.py optimize_zhihu.py optimize_cntv.py optimize_amap.py optimize_smzdm.py optimize_rrtv.py optimize_soul.py optimize_xmly.py optimize_didi.py optimize_taobao.py optimization_guard.py
      - name: 检查小红书本地视频脚本语法
        run: node --check scripts/xiaohongshu/xiaohongshu-v4.js
      - name: 检查小红书主响应脚本语法
        run: node --check scripts/xiaohongshu/xiaohongshu.js
      - name: 检查 R-Store 小红书本地响应脚本语法
        run: node --check scripts/xiaohongshu/xiaohongshu-rstore.js
      - name: 检查 R-Store 微博本地响应脚本语法
        run: node --check scripts/weibo/weibo-rstore.js
      - name: 检查知乎本地响应脚本语法
        run: node --check scripts/zhihu/zhihu.js
      - name: 检查高德本地响应脚本语法
        run: node --check sources/amap/rucu6_amap.js
      - name: 检查 CNFTP 本地响应脚本语法
        run: node --check scripts/cnftp/cnftp.js
      - name: 检查 CNTV 本地响应脚本语法
        run: node --check scripts/cntv/cntv.js
      - name: 检查 R-Store 高德本地响应脚本语法
        run: node --check scripts/amap/amap.js
      - name: 检查滴滴本地响应脚本语法
        run: node --check scripts/didi/didi.js
      - name: 检查什么值得买本地响应脚本语法
        run: node --check scripts/smzdm/smzdm.js
      - name: 检查人人视频本地响应脚本语法
        run: node --check scripts/rrtv/rrtv.js
      - name: 检查 Soul 本地响应脚本语法
        run: node --check scripts/soul/soul.js
      - name: 检查喜马拉雅本地响应脚本语法
        run: node --check scripts/xmly/xmly.js
      - name: 检查帆书本地响应脚本语法
        run: node --check scripts/dushu365/dushu365.js

      - name: 测试校验器与来源依赖门禁
        run: python3 -m unittest -v test_validate_plugin.py test_fix_script_configs.py test_merge_plugins.py test_source_guard.py test_audit_plugin.py test_deep_audit.py test_mitm_policy.py test_amap_dependency_guard.py test_apply_amap_local_overrides.py test_compare_rule_provenance.py test_source_health_guard.py test_finalize_provenance.py test_rule_risk_history.py test_integrate_spotify.py test_convert_qx2loon.py test_convert_filter_qx2loon.py test_stage_romeo_plugins.py test_runtime_performance_audit.py test_xiaohongshu_v4_performance.py test_xiaohongshu_performance.py test_xiaohongshu_rstore_performance.py test_weibo_rstore_performance.py test_amap_response_compaction.py test_cnftp_performance.py test_zhihu_performance.py test_bilibili_json_performance.py test_cntv_performance.py test_amap_rstore_performance.py test_didi_performance.py test_response_array_compaction_performance.py test_baidumap_binary_performance.py test_taobao_optimization.py test_xianyu_jd_upstream.py test_jd_lazy_serialization.py test_optimization_guard.py test_smzdm_performance.py test_rrtv_performance.py test_soul_performance.py test_xmly_performance.py test_dushu365_performance.py

      - name: 创建隔离构建目录
        run: |
          mkdir -p /tmp/loon-build
          if [ -s source-report.json ]; then
            cp source-report.json /tmp/loon-build/source-report.previous.json
          else
            printf '{}' > /tmp/loon-build/source-report.previous.json
          fi
          if [ -s rule-history.json ]; then
            cp rule-history.json /tmp/loon-build/rule-history.previous.json
          else
            printf '{\"schema_version\":1,\"snapshots\":[]}' > /tmp/loon-build/rule-history.previous.json
          fi
          if [ -s rule-provenance.json ]; then
            cp rule-provenance.json /tmp/loon-build/rule-provenance.previous.json
          else
            printf '{"schema_version":1,"upstream_revisions":{},"rewrite":[],"script":[],"rule_events":[]}' > /tmp/loon-build/rule-provenance.previous.json
          fi

      - name: 转换重写规则（先写入临时产物）
        run: python3 convert_qx2loon.py -o /tmp/loon-build/allAdRewrite.plugin

      - name: 固定 Romeo 上游版本并同步保留的 App 插件、瓜子影视与高德依赖
        run: |
          mkdir -p /tmp/amap sources/amap sources/alipayAdBlock
          git clone --depth 1 https://github.com/ifflagged/Romeo.git /tmp/romeo
          ROMEO_SHA="$(git -C /tmp/romeo rev-parse HEAD)"
          echo "ROMEO_SHA=$ROMEO_SHA" >> "$GITHUB_ENV"
          # 固定 Romeo commit 后生成原 AOOMEE 合并槽的兼容插件目录。
          python3 stage_romeo_plugins.py --romeo-repo /tmp/romeo --commit "$ROMEO_SHA" --output /tmp/romeo/plugins --zmjde-output /tmp/romeo-zmjde/Plugin
          # 瓜子影视使用 Romeo 收录的 ddgksf2013 官方 QuanX 源文件，继续走原有 QuanX -> Loon 转换链路。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf" > /tmp/GuaZiVideoAds.conf
          wc -c /tmp/GuaZiVideoAds.conf
          echo "GuaZiVideoAds upstream: ifflagged/Romeo@$ROMEO_SHA:Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf"
          # zirawell AlipayAdBlock：只缓存插件源；重复脚本由 base 已有 Eleme handler 覆盖，不另载入第二份脚本。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/zirawell/Beta/alipayAdBlock.lpx" > sources/alipayAdBlock/alipayAdBlock.lpx
          python3 -c 'from pathlib import Path; from source_guard import validate_alipayadblock; p=Path("sources/alipayAdBlock/alipayAdBlock.lpx"); print("AlipayAdBlock Romeo cache validated:", validate_alipayadblock(p.read_text(encoding="utf-8-sig")))'
          echo "AlipayAdBlock upstream: ifflagged/Romeo@$ROMEO_SHA:Modules/Loon/zirawell/Beta/alipayAdBlock.lpx"
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/sooyaaabo/Amap.lpx" > /tmp/amap/Amap.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/rucu6_amap.js" > /tmp/amap/rucu6_amap.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/sooyaaabo/Amap/loon_Amap.recommend.jq" > /tmp/amap/loon_Amap.recommend.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_updatable.jq" > /tmp/amap/updatable.jq
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/Kelee/Amap_remove_ads/kelee_search_poi_detail.jq" > /tmp/amap/search_poi_detail.jq
          echo "Romeo pinned commit: $ROMEO_SHA"
          wc -c /tmp/amap/*

      - name: 从固定 Romeo commit 获取 Spotify 官方插件及四个脚本
        run: |
          mkdir -p sources/spotify scripts/spotify /tmp/spotify-scripts
          # 与瓜子影视、高德共用同一 ROMEO_SHA，确保一次同步内来源版本一致。
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/Loon/devchristian1337/Official/Spotify.lpx" > sources/spotify/Spotify.lpx
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-gabo.js" > /tmp/spotify-scripts/spot-gabo.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoSearchAd.js" > /tmp/spotify-scripts/spot-NoSearchAd.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoHomeAd.js" > /tmp/spotify-scripts/spot-NoHomeAd.js
          git -C /tmp/romeo show "$ROMEO_SHA:Modules/JavaScript/devchristian1337/Spotify/devchristian1337_spot-NoScrollAd.js" > /tmp/spotify-scripts/spot-NoScrollAd.js
          echo "Spotify upstream: ifflagged/Romeo@$ROMEO_SHA"
          wc -c sources/spotify/Spotify.lpx /tmp/spotify-scripts/*.js

      - name: 校验克隆来源并生成来源报告
        run: |
          python3 source_guard.py --romeo /tmp/romeo --zmjde /tmp/romeo-zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --previous-report source-report.json --report source-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from stage_romeo_plugins import (LEGACY_SNAPSHOTS, ROMEO_PLUGIN_MAP, ZMJDE_APP_MAP, ZMJDE_GENERAL_MAP)
          report_path = Path("source-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          from source_guard import validate_alipayadblock
          alipay_path = Path("sources/alipayAdBlock/alipayAdBlock.lpx")
          alipay_source = validate_alipayadblock(alipay_path.read_text(encoding="utf-8-sig"))
          alipay_source.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "upstream_path": "Modules/Loon/zirawell/Beta/alipayAdBlock.lpx",
          })
          report["AlipayAdBlock"] = alipay_source
          report["retired_rule_sources"] = ["block", "thelong", "myblockads"]
          report["source_migrations"] = {
              "aoomee": {
                  "status": "planned",
                  "from": "https://github.com/aoomee/Loon-Adblock-Plugins",
                  "to": "https://github.com/ifflagged/Romeo",
                  "scope": "AOOMEE plugin compatibility slot and its runtime assets",
              },
              "zmjde": {
                  "status": "planned",
                  "from": "https://github.com/zmjde/loon-plugins",
                  "to": "https://github.com/ifflagged/Romeo",
                  "scope": "zmjde App/general plugin compatibility slots and runtime assets",
              },
          }
          romeo_slot = report.get("aoomee")
          if not isinstance(romeo_slot, dict):
              raise SystemExit("source-report.json 缺少 Romeo 替代来源统计")
          romeo_slot.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "source_mode": "Romeo Modules/Loon (including Kelee WeChat/Weidian plugins) + pinned AOOMEE-only local snapshots",
              "legacy_snapshot_files": list(LEGACY_SNAPSHOTS),
              "romeo_module_paths": list(ROMEO_PLUGIN_MAP.values()),
              "compatibility_key": "aoomee (retained only to preserve historical provenance continuity)"
          })
          source = report.get("GuaZiVideoAds")
          if not isinstance(source, dict):
              raise SystemExit("source-report.json 缺少 GuaZiVideoAds 校验结果")
          source.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "upstream_path": "Modules/QuantumultX/ddgksf2013/Official/GuaZiVideoAds.conf",
          })
          zmjde_slot = report.get("zmjde")
          if not isinstance(zmjde_slot, dict):
              raise SystemExit("source-report.json 缺少 Romeo 映射后的历史 zmjde 兼容槽统计")
          zmjde_slot.update({
              "upstream_repository": "https://github.com/ifflagged/Romeo",
              "upstream_commit": os.environ["ROMEO_SHA"],
              "source_mode": "Romeo Modules/Loon/Kelee/Official; historical zmjde merge priority retained",
              "app_plugin_paths": list(ZMJDE_APP_MAP.values()),
              "general_plugin_paths": list(ZMJDE_GENERAL_MAP.values()),
              "compatibility_key": "zmjde (retained only for historical merge/provenance continuity)"
          })
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python3 amap_dependency_guard.py --assets /tmp/amap --plugin /tmp/amap/Amap.lpx --commit "$ROMEO_SHA" --report source-report.json
          python3 apply_amap_local_overrides.py --plugin /tmp/amap/Amap.lpx
          cp /tmp/amap/* sources/amap/
          # Reapply the reviewed in-place compaction after upstream assets are copied.
          # The upstream copy must never silently revert PR #340's runtime optimization.
          git apply --check patches/amap-rucu6-performance.patch
          git apply patches/amap-rucu6-performance.patch
          node --check sources/amap/rucu6_amap.js
          python3 -m unittest -v test_amap_response_compaction.py

      - name: 检查本地性能优化未被上游覆盖
        run: python3 optimization_guard.py

      - name: 合并各来源去广告规则（临时目录）
        run: python3 merge_plugins.py --base /tmp/loon-build/allAdRewrite.plugin --extra none --filter none --romeo-plugins /tmp/romeo --zmjde /tmp/romeo-zmjde --qxapp /tmp/GuaZiVideoAds.conf --amap /tmp/amap/Amap.lpx --myblockads none --alipayadblock sources/alipayAdBlock/alipayAdBlock.lpx --out /tmp/loon-build/allAdRewrite.plugin --provenance-out /tmp/loon-build/rule-provenance.json --source-report source-report.json

      - name: 保存合并阶段产物用于最终来源追溯
        run: cp /tmp/loon-build/allAdRewrite.plugin /tmp/loon-build/allAdRewrite.after-merge.plugin

      - name: 提取并整合 Spotify 去广告规则（随上游每日更新）
        run: |
          python3 integrate_spotify.py --plugin /tmp/loon-build/allAdRewrite.plugin --source-plugin sources/spotify/Spotify.lpx --scripts-source /tmp/spotify-scripts --scripts-dest scripts/spotify --upstream-commit "$SPOTIFY_SHA" --metadata sources/spotify/upstream.json
          cp /tmp/loon-build/allAdRewrite.plugin /tmp/loon-build/allAdRewrite.after-spotify.plugin

      - name: 应用本地 App 规则覆盖（防止上游合并时丢失）
        run: |
          python3 optimize_cntv.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_amap.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 apply_local_overrides.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_didi.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_taobao.py --plugin /tmp/loon-build/allAdRewrite.plugin --runtime scripts/taobao/taobao.js
          python3 optimize_cnftp.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_xiaohongshu.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_xiaohongshu_rstore.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_weibo_rstore.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_zhihu.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_smzdm.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_rrtv.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_soul.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_xmly.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 optimize_dushu365.py --plugin /tmp/loon-build/allAdRewrite.plugin
          python3 fix_script_configs.py --plugin /tmp/loon-build/allAdRewrite.plugin
          # Pin remaining Romeo raw URLs used by retained standalone App plugins to the same ROMEO_SHA.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from stage_romeo_plugins import _pin_romeo_references

          plugin = Path("/tmp/loon-build/allAdRewrite.plugin")
          romeo_repo = Path("/tmp/romeo")
          commit = os.environ["ROMEO_SHA"]
          text = plugin.read_text(encoding="utf-8-sig")
          unpinned_prefixes = (
              "https://github.com/ifflagged/Romeo/raw/main/",
              "https://github.com/ifflagged/Romeo/raw/refs/heads/main/",
              "https://raw.githubusercontent.com/ifflagged/Romeo/main/",
          )
          before = sum(text.count(prefix) for prefix in unpinned_prefixes)
          text = _pin_romeo_references(text, romeo_repo, commit)
          if any(prefix in text for prefix in unpinned_prefixes):
              raise SystemExit("Unpinned Romeo raw/main runtime URL remains in final plugin")
          plugin.write_text(text, encoding="utf-8")
          print("Pinned %d Romeo runtime URLs to %s" % (before, commit))
          PY
          python3 check_script_v2.py /tmp/loon-build/allAdRewrite.plugin
          python3 finalize_provenance.py --before /tmp/loon-build/allAdRewrite.after-merge.plugin --after-spotify /tmp/loon-build/allAdRewrite.after-spotify.plugin --final /tmp/loon-build/allAdRewrite.plugin --provenance /tmp/loon-build/rule-provenance.json

      - name: 校验临时产物并同步 README 统计
        run: python3 validate_plugin.py /tmp/loon-build/allAdRewrite.plugin --update-readme README.md

      - name: 自动比较上游规则新增、删除与动作变化
        run: python3 compare_rule_provenance.py --previous /tmp/loon-build/rule-provenance.previous.json --current /tmp/loon-build/rule-provenance.json --out /tmp/loon-build/rule-diff.json

      - name: 来源可靠性评分与异常更新发布门禁
        run: |
          python3 source_health_guard.py --previous-sources /tmp/loon-build/source-report.previous.json --current-sources source-report.json --previous-provenance /tmp/loon-build/rule-provenance.previous.json --current-provenance /tmp/loon-build/rule-provenance.json --diff /tmp/loon-build/rule-diff.json --out /tmp/loon-build/source-health.json

      - name: 上传来源健康门禁诊断数据（失败时保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-debug-${{ github.run_id }}
          path: |
            /tmp/loon-build/rule-diff.json
            /tmp/loon-build/rule-provenance.json
            /tmp/loon-build/rule-provenance.previous.json
            /tmp/loon-build/source-health.json
            /tmp/loon-build/source-report.previous.json
            source-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: 规则变更风险分级与来源历史趋势
        run: |
          python3 rule_risk_history.py --diff /tmp/loon-build/rule-diff.json --health /tmp/loon-build/source-health.json --source-report source-report.json --provenance /tmp/loon-build/rule-provenance.json --previous-history /tmp/loon-build/rule-history.previous.json --run-id "$GITHUB_RUN_ID" --risk-out /tmp/loon-build/rule-risk.json --history-out /tmp/loon-build/rule-history.json

      - name: 只读审计 UDP、MITM 与 Script 风险
        run: |
          python3 audit_plugin.py /tmp/loon-build/allAdRewrite.plugin --summary-only
          python3 deep_audit.py /tmp/loon-build/allAdRewrite.plugin --summary-only
          python3 deep_audit.py /tmp/loon-build/allAdRewrite.plugin --json /tmp/deep-audit-sync.json --markdown /tmp/deep-audit-sync.md
          python3 runtime_performance_audit.py /tmp/loon-build/allAdRewrite.plugin --repo-root . --summary-only
          python3 runtime_performance_audit.py /tmp/loon-build/allAdRewrite.plugin --repo-root . --json /tmp/runtime-performance-sync.json --markdown /tmp/runtime-performance-sync.md

      - name: 上传同步构建规则来源追溯报告
        uses: actions/upload-artifact@v4
        with:
          name: rule-provenance-${{ github.run_id }}
          path: /tmp/loon-build/rule-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传规则变更差异报告
        uses: actions/upload-artifact@v4
        with:
          name: rule-diff-${{ github.run_id }}
          path: /tmp/loon-build/rule-diff.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传来源可靠性与异常检测报告
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: /tmp/loon-build/source-health.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传规则风险分级报告与历史趋势
        uses: actions/upload-artifact@v4
        with:
          name: rule-risk-history-${{ github.run_id }}
          path: |
            /tmp/loon-build/rule-risk.json
            /tmp/loon-build/rule-history.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传同步构建深度审计报告
        uses: actions/upload-artifact@v4
        with:
          name: deep-audit-sync-${{ github.run_id }}
          path: |
            /tmp/deep-audit-sync.json
            /tmp/deep-audit-sync.md
          if-no-files-found: error
          retention-days: 14

      - name: 上传运行时性能审计报告
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-${{ github.run_id }}
          path: |
            /tmp/runtime-performance-sync.json
            /tmp/runtime-performance-sync.md
          if-no-files-found: error
          retention-days: 14

      - name: 校验通过后替换正式产物
        run: |
          cp /tmp/loon-build/allAdRewrite.plugin allAdRewrite.plugin.tmp && mv allAdRewrite.plugin.tmp allAdRewrite.plugin
          cp /tmp/loon-build/rule-provenance.json rule-provenance.json
          cp /tmp/loon-build/rule-diff.json rule-diff.json
          cp /tmp/loon-build/source-health.json source-health.json
          cp /tmp/loon-build/rule-risk.json rule-risk.json
          cp /tmp/loon-build/rule-history.json rule-history.json

      # 可选网络检查：仅输出警告，不因上游短暂限流阻断规则同步。
      # 本地排查远程脚本：python3 validate_plugin.py allAdRewrite.plugin --check-remote
      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- allAdRewrite.plugin README.md source-report.json rule-provenance.json rule-history.json sources/ scripts/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并产物与统计均无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: 提交并推送
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- allAdRewrite.plugin README.md source-report.json rule-provenance.json rule-history.json sources/ scripts/
          git commit -m "chore: sync upstream rules and plugin stats $(date -u +%Y-%m-%d)"
          # Every generated file in the managed output roots must be committed.
          # Fail with a useful diagnostic instead of attempting a rebase with leftovers.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Generated sync outputs remain outside the commit; inspect the paths below."
            git status --short
            exit 1
          fi
          # Another workflow or a PR merge may advance main after checkout.
          # Rebase the generated snapshot onto the latest main before pushing;
          # never force-push or overwrite concurrent changes.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Sync commit conflicts with newer main; rerun the full sync from the latest revision."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt rejected; refreshing main and retrying."
            sleep 2
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
